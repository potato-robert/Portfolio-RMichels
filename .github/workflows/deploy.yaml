name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache rm-assets
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/rm-assets
          key: rm-assets-${{ runner.os }}-${{ hashFiles('assets/**', 'src/integrations/rm-assets/**') }}
          restore-keys: |
            rm-assets-${{ runner.os }}-

      - name: Astro check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Content validation
        run: npm run test:content

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run test:verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # SFTP login root is /home/USER; the live site is public_html/ (same as legacy FTPS server-dir ./ when FTP was rooted there).
      # No remote delete: upload/overwrite only. Never touch public_html/subdomains/ (manual deploys only).
      - name: Deploy dist/ to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          local_path: ./dist/*
          remote_path: /home/${{ secrets.HOSTINGER_SFTP_USERNAME }}/public_html
          sftp_only: true
          delete_remote_files: false
          rsyncArgs: --exclude=subdomains --exclude=subdomains/**
          sftpArgs: -o ConnectTimeout=30
