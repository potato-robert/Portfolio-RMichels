name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache rm-assets
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/rm-assets
          key: rm-assets-${{ runner.os }}-${{ hashFiles('assets/**', 'src/integrations/rm-assets/**') }}
          restore-keys: |
            rm-assets-${{ runner.os }}-

      - name: Astro check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Content validation
        run: npm run test:content

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run test:verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
